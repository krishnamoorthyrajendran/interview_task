name: Terraform CI/CD

on:
  push:
    branches:
      - prod
permissions:
  contents: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform destory
        run: terraform destory -auto-approve

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t my-docker-repo:${{ github.run_number }} .

      - name: Tag Docker Image
        run: |
          docker tag my-docker-repo:${{ github.run_number }} \
          413745378153.dkr.ecr.ap-south-1.amazonaws.com/my-docker-repo:${{ github.run_number }}

      - name: Push Docker Image
        run: |
          docker push 413745378153.dkr.ecr.ap-south-1.amazonaws.com/my-docker-repo:${{ github.run_number }}

      - name: Update Kubernetes Manifest
        run: |
          sed -i \
            "s|image: 413745378153.dkr.ecr.ap-south-1.amazonaws.com/my-docker-repo:.*|image: 413745378153.dkr.ecr.ap-south-1.amazonaws.com/my-docker-repo:${{ github.run_number }}|" \
            k8s/frontend.yaml

      - name: Commit and Push Updated Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/frontend.yaml
          git commit -m "Update frontend image to version ${{ github.run_number }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:prod
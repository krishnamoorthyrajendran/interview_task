name: Terraform CI/CD

on:
  push:
    branches:
      - prod

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t my-docker-repo:${{ github.run_number }} .

      - name: Tag Docker Image
        run: |
          docker tag my-docker-repo:${{ github.run_number }} \
          413745378153.dkr.ecr.ap-south-1.amazonaws.com/my-docker-repo:${{ github.run_number }}

      - name: Push Docker Image
        run: |
          docker push 413745378153.dkr.ecr.ap-south-1.amazonaws.com/my-docker-repo:${{ github.run_number }}


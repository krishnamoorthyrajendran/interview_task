apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=Backend application"
          ports:
            - containerPort: 5678

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: web
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 5678
      targetPort: 5678            
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-readonly-user
  namespace: web

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-readonly-role
  namespace: web
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-readonly-binding
  namespace: web
subjects:
  - kind: ServiceAccount
    name: db-readonly-user
    namespace: web
roleRef:
  kind: Role
  name: db-readonly-role
  apiGroup: rbac.authorization.k8s.io